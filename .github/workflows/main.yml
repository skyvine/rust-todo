name: Main
on:
  push:
    branches:
      - trunk

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB:       todo

    env:
      DATABASE_URL: postgres://postgres:test-password@localhost/todo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Diesel
        run : |
          sudo apt-get install postgresql-16
          cargo install diesel_cli --no-default-features --features postgres --locked

      - name: Setup Database
        run: |
          diesel migration run

      - name: Run Tests
        run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run Linter
        run: cargo clippy -- -D warnings
