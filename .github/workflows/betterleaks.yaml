name: Betterleaks
on:
  push:
    branches:
      - trunk

jobs:
  run_betterleaks:
    name: Run Betterleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install go
        run: |
          sudo apt install golang-go

      - name: Install Betterleaks
        run: |
          go install github.com/betterleaks/betterleaks/v2@latest

      - name: Run Betterleaks
        run: |
          # generic-password and generic-credential-uri create a bunch of false positives
          # on the test infrastructure.
          ~/go/bin/betterleaks --no-banner git . --disable-rule=generic-password --disable-rule=generic-credential-uri
